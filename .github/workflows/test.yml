name: Test

permissions: {}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8
        with:
          python-version: "3.13"

      - name: Set up Python
        run: uv python install 3.13

      - name: Set up R
        uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
        with:
          working-directory: "./tests/renv"
          r-version: "renv"

      - name: Set up renv
        uses: r-lib/actions/setup-renv@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
        with:
          working-directory: "./tests/renv"

      - name: Build mkdocstrings-R
        run: uv build

      - name: Install test dependencies
        run: uv sync --only-group test --frozen --no-install-project

      - name: Install built wheel
        run: uv pip install dist/*.whl

      # This is needed, otherwise you get an error like "unable to load shared object
      # '/opt/R/4.6.1/lib/R/library/methods/libs/methods.so'" or similar.
      - name: Configure R shared libraries for rpy2
        run: echo "LD_LIBRARY_PATH=$(uv run --no-sync python -m rpy2.situation LD_LIBRARY_PATH)" >> "$GITHUB_ENV"

      - name: Run tests
        run: uv run --no-sync pytest
